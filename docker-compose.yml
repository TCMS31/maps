services:
  maps:
    build:
      context: .
      args:
        # A Mapbox public token. Read from your shell or a .env file next to
        # this compose file. The app builds and serves without one -- the map
        # is replaced by a notice explaining what is missing.
        NEXT_PUBLIC_MAPBOX_TOKEN: ${NEXT_PUBLIC_MAPBOX_TOKEN:-}
    ports:
      # Host port is overridable so this does not collide with anything else
      # you have on 4500.
      - "${HOST_PORT:-4500}:4500"
    restart: unless-stopped
    healthcheck:
      test:
        ["CMD", "wget", "--quiet", "--tries=1", "--spider",
         "http://127.0.0.1:4500/api/health"]
      interval: 30s
      timeout: 3s
      start_period: 20s
      retries: 3
